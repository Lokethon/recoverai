name: Deploy to GitHub Pages

on:
  # Auto-deploy after CI succeeds on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow a manual deploy from the Actions tab
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    # Only deploy if CI passed (or if triggered manually)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # base_path comes from configure-pages, so this works for a project
        # page (/recoverai/), a user page (/), and a custom domain alike.
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
        env:
          NODE_ENV: production
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules. Serving index.html as 404.html
        # means a refresh on any path still loads the app instead of a 404.
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll processing
        # Without this, Pages ignores files and folders beginning with an
        # underscore, which some bundlers emit.
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
